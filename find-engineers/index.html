      gap: 1rem;
    }
    .fe-card {
      display: flex;

      border-radius: var(--radius-lg);

      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .fe-avatar {
      position: relative;
      display: grid;
      place-items: center;
      width: 4.25rem;
      height: 4.25rem;
      flex: 0 0 auto;

    .fe-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;

      transform: scale(1.18);
    }
    .fe-avatar--letter {

      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(160deg, #eef0fb, #d9dcf3);
    }

    .fe-match {

    .fe-match span {

    .fe-match__num {
      margin: 0;

      font-size: 0.84rem;
      font-weight: 700;
    }
    .fe-card__meta, .fe-card__place {
      margin: 0;
      color: var(--color-muted);
      font-size: 0.9rem;
    }
    .fe-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .fe-tags li {
      padding: 0.28rem 0.55rem;
      border-radius: var(--radius-sm);
      background: var(--color-surface-2);
      font-size: 0.78rem;
      font-weight: 600;
    }
    .fe-verified {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0;
      color: #6a62c8;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .fe-verified span:first-child {

      place-items: center;

      height: 1.05rem;

      font-size: 0.65rem;
    }
    .fe-points {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .fe-points li {
      position: relative;
      padding-left: 0.9rem;
      color: var(--color-text);
      font-size: 0.88rem;
    }
    .fe-points li + li { margin-top: 0.25rem; }
    .fe-points li::before {
      content: "";

      top: 0.55em;

      height: 0.35rem;

    .fe-more {

      text-align: center;

      gap: 0.5rem;

    .fe-more-row {
      display: grid;

    .fe-gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 0 4rem;
    }
    .fe-gate__card {
      width: min(32rem, 100%);
      padding: 1.5rem 1.25rem 1.35rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: #fff;
      box-shadow: var(--shadow-soft);

    .fe-field { margin-bottom: 0.85rem; }
    .fe-field label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.875rem;
      font-weight: 700;

    .fe-field label span { color: var(--color-muted); font-weight: 500; }

    .fe-consent {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      margin: 0.35rem 0 0.85rem;
      font-size: 0.9rem;
    }
    .fe-consent input { margin-top: 0.25rem; accent-color: var(--color-primary); }
    .fe-form-status {
      min-height: 1.3rem;
      margin: 0 0 0.65rem;
      color: #8a2f2f;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .fe-gate__back { margin-top: 1rem; }

    /* ---------- Candidate profile ---------- */
    .fe-profile {
      width: min(64rem, 100%);
      margin: 0 auto;
      padding: 1.25rem 0 6.5rem;
    }
    .fe-pf-back { margin-bottom: 0.75rem; }

    .fe-pf-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.25rem;
      margin: 0 0 1.25rem;
      padding: 0 0 1.25rem;
      border-bottom: 1px solid var(--color-border);
    }
    .fe-profile .fe-avatar {
      width: 4.5rem;
      height: 4.5rem;
      border: 2px solid var(--color-border);
      box-shadow: none;
    }
    .fe-profile .fe-avatar--letter { font-size: 1.65rem; }
    .fe-pf-head__text { flex: 1; min-width: 12rem; }
    .fe-pf-role {
      margin: 0 0 0.15rem;
      color: var(--color-muted);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .fe-pf-name {
      margin: 0;
      color: var(--color-navy);
      font-size: clamp(1.5rem, 4.5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .fe-pf-note {
      margin: 0.35rem 0 0;
      color: var(--color-muted);
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.4;
    }
    .fe-pf-badge {
      flex-shrink: 0;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(84, 91, 179, 0.35);
      background: var(--color-surface-2);
      color: var(--color-primary-dark);
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .fe-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem 1.5rem;
      margin: 0 0 1.5rem;
      padding: 0 0 1.25rem;
      border-bottom: 1px solid var(--color-border);
    }
    .fe-facts__item { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .fe-facts dt {
      color: var(--color-muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .fe-facts dd {
      margin: 0;
      color: var(--color-navy);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .fe-pf-grid { display: grid; gap: 1.5rem; align-items: start; }
    .fe-pf-lead { min-width: 0; }
    .fe-pf-main {
      min-width: 0;
      padding: 0.25rem 0 0;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: #fff;
    }
    .fe-pf-section {
      margin: 0;
      padding: 1.15rem 1.25rem 1.2rem;
      border-top: 1px solid var(--color-border);
    }
    .fe-pf-section:first-child { border-top: 0; }
    .fe-pf-section h2 {
      margin: 0 0 0.65rem;
      color: var(--color-navy);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .fe-pf-section p { margin: 0; color: #3a3a44; font-size: 0.98rem; line-height: 1.65; }
    .fe-checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; }
    .fe-checks li {
      position: relative;
      padding-left: 1.35rem;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.5;
      color: #3a3a44;
    }
    .fe-checks li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 50%;
      background: var(--color-primary);
    }
    .fe-skills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0; padding: 0; list-style: none; }
    .fe-skills li {
      padding: 0.3rem 0.7rem;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      background: #fff;
      color: var(--color-primary-dark);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .fe-skills li.is-core {
      border-color: var(--color-primary);
      background: var(--color-surface-2);
      color: var(--color-primary-dark);
    }

    .fe-pf-side__card {
      padding: 1.35rem 1.25rem 1.3rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: #fff;
      box-shadow: var(--shadow-soft);

      margin: 0 0 0.85rem;

      font-size: 1.05rem;
      font-weight: 700;

      width: 100%;
      min-height: 3.5rem;
      padding: 0.9rem 1.15rem;
      font-size: 1.02rem;
      white-space: nowrap;
      box-shadow: var(--shadow-soft);
    }

      box-shadow: var(--shadow-hover);
    }
    .fe-pf-side__card .fe-confirm { margin: 0; }
    .fe-pf-side__points {
      display: grid;
      gap: 0.35rem;
      margin: 0.85rem 0 0;
      padding: 0.75rem 0 0 1.1rem;

      color: var(--color-muted);
      font-size: 0.82rem;
      font-weight: 500;
      line-height: 1.4;
    }
    .fe-pf-side__points li { padding-left: 0.15rem; }

    .fe-confirm {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;

      padding: 0.9rem 1rem;

      line-height: 1.45;

      place-items: center;
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 50%;

      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .fe-pf-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      display: flex;
      align-items: center;

      gap: 0.85rem;
      padding: 0.65rem 1rem calc(0.65rem + env(safe-area-inset-bottom));

      border-top: 1px solid var(--color-border);

    .fe-pf-bar__who { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }

    .fe-pf-bar__who span { color: var(--color-primary-dark); font-size: 0.8rem; font-weight: 700; }
    .fe-pf-cta--bar { min-height: 2.9rem; padding: 0.6rem 1rem; font-size: 0.92rem; white-space: nowrap; box-shadow: none; }
    .fe-pf-bar__done { color: #0f7a5a; font-size: 0.9rem; font-weight: 700; }

    @media (min-width: 720px) {
      .fe-profile .fe-avatar { width: 5rem; height: 5rem; }

    @media (min-width: 980px) {
      .fe-profile { padding-bottom: 4rem; }
      .fe-pf-grid {
        grid-template-columns: minmax(0, 1fr) 18.5rem;
        grid-template-areas:
          "lead side"
          "main side";
        gap: 1.5rem;
      }
      .fe-pf-lead { grid-area: lead; }
      .fe-pf-lead .fe-facts { margin-bottom: 0; }
      .fe-pf-main { grid-area: main; }
      .fe-pf-side { grid-area: side; position: sticky; top: calc(var(--header-h) + 1rem); }
      .fe-pf-bar { display: none; }
    }

    @media (min-width: 720px) {
      .fe-search { flex-direction: row; align-items: flex-start; }

      .fe-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .fe-more-row { grid-template-columns: 1.1fr 1.4fr auto; align-items: center; }
      .fe-gate__card { padding: 2rem 1.75rem 1.6rem; }
    }

    @media (min-width: 980px) {
      .fe-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 18.5rem;
        column-gap: 4.75rem;
        row-gap: 1.5rem;
        align-items: start;
        padding-top: 0;
        padding-bottom: 0;
      }
      .fe-summary {
        position: sticky;
        top: calc(var(--header-h) + 1.25rem);
        order: 0;
        padding: 1.15rem 1.15rem 0.35rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: #fff;
        box-shadow: var(--shadow-soft);

      .fe-summary__body,
      .fe-summary.is-open .fe-summary__body {

        margin: 0;
        padding: 0;
        border: 0;
      }
      .fe-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      html { scroll-behavior: auto; }
    }
