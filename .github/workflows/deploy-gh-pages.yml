# Publishes a subpath-aware build to branch `gh-pages` (project site: /<repo>/).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static site (GitHub.io subpath)
        env:
          OUTPUT_ROOT: dist
        run: node build-pages.js --base=/${{ github.event.repository.name }}

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # Ensures the live site republishes from gh-pages (avoids stale main-branch artifact after source changes).
      - name: Trigger GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds"
