# Publishes to branch `gh-pages` for Custom Domain lp.betterengineer.com at /aimanufacturing/
# See GITHUB_PAGES_LP_HOSTING.md for DNS (Route 53) and repo settings.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static site (path /aimanufacturing/, manufacturing as index)
        env:
          OUTPUT_ROOT: dist/aimanufacturing
          PAGES_PUBLISH_ROOT: dist
          GITHUB_PAGES_CNAME: lp.betterengineer.com
          LP_ROOT_PAGE: manufacturing
        run: node build-pages.js --base=/aimanufacturing

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # Ensures the live site republishes from gh-pages (avoids stale main-branch artifact after source changes).
      - name: Trigger GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds"
