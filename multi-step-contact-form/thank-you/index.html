<html lang="en">
<head>

  <meta name="description" content="Thank you for your answers. Our team has been notified of your hiring needs and will reach out shortly.">

  <link rel="canonical" href="https://www.betterengineer.com/multi-step-contact-form/thank-you">

  <style>
    :root {
      --color-primary: #545bb3;
      --color-primary-dark: #3d4293;
      --color-navy: #001062;
      --color-text: #1c1c1c;
      --color-surface: #fafafe;
      --radius-sm: 4px;
      --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: var(--font);
      color: var(--color-text);
      background: var(--color-surface);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: var(--color-primary); }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; }
    .skip-link {
      position: absolute; left: -9999px; z-index: 20;
      padding: 0.5rem 1rem; background: var(--color-primary); color: #fff;
    }
    .skip-link:focus { left: 1rem; top: 1rem; }
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      padding: 2rem 2.25rem 1.125rem;
    }
    .hire-brand { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .logo-link { line-height: 0; }
    .logo-link img { height: 42px; width: auto; }
    .hire-brand__tagline {
      margin: 0;
      color: var(--color-text);
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.35;
    }
    .text-highlight { color: var(--color-primary); font-weight: 600; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0.55rem 1.35rem;
      border: 2px solid var(--color-primary);
      border-radius: var(--radius-sm);
      background: var(--color-primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { background: var(--color-primary-dark); border-color: var(--color-primary-dark); }
    main { flex: 1; }
    .hire-wizard-shell {
      width: min(100%, 60rem);
      margin: 0 auto;
      padding: 1.25rem max(1.5rem, env(safe-area-inset-left, 0px)) 3rem;
    }
    .hire-confirm h1 {
      margin: 0.5rem 0 0.75rem;
      color: var(--color-navy);
      font-size: clamp(1.7rem, 3vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }
    .hire-confirm p {
      margin: 0 0 1.35rem;
      max-width: 36rem;
      font-size: 1.0625rem;
      line-height: 1.55;
    }
    .hire-confirm .btn { min-height: 3.25rem; padding: 0.85rem 1.4rem; }
    @media (max-width: 640px) {
      .site-header { align-items: flex-start; padding: 1.5rem 1.35rem 1rem; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="hire-brand">
      <a class="logo-link" href="https://www.betterengineer.com/" aria-label="BetterEngineer home">
        <img src="/icons/betterengineer-logo.svg" alt="BetterEngineer" width="233" height="42">
      </a>
    </div>
    <a class="btn" href="https://calendly.com/tim-salsamobi/30min" target="_blank" rel="noopener noreferrer">Book a Call</a>
  </header>
  <main id="main">
    <div class="hire-wizard-shell">
      <div class="hire-confirm">
        <h1>Thank you for your answers!</h1>
        <p>Our team has been notified of your needs and will reach out to you shortly.</p>
        <a class="btn" href="https://calendly.com/tim-salsamobi/30min" target="_blank" rel="noopener noreferrer">Schedule a meeting with our team now</a>
      </div>
    </div>
  </main>
</body>
</html>
